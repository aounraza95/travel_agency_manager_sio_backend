services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: travel_agency_db2
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: db
      DB_DATABASE: travel_agency_db2
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db

  frontend:
    build:
      context: ../travel_agency_manager_sio_frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ../travel_agency_manager_sio_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
